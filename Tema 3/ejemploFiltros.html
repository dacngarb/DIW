<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="450" height="180">
    <defs>
    <!-- Filtro de desenfoque -->
    <filter id="desenfoque">
        <feGaussianBlur stdDeviation="4" />
    </filter>
    <!-- Filtro de sombra -->
    <filter id="sombra">
        <feDropShadow
        dx="5"
        dy="5"
        stdDeviation="1"
        flood-color="black"
        flood-opacity="0.6" />
    </filter>
    </defs>
    <!-- Círculo normal -->
    <circle cx="75" cy="80" r="40"
        fill="steelblue" />
    <!-- Círculo desenfocado -->
    <circle cx="220" cy="80" r="40"
        fill="steelblue"
        filter="url(#desenfoque)" />
    <!-- Círculo con sombra -->
    <circle cx="365" cy="80" r="40"
        fill="steelblue"
        filter="url(#sombra)" />
    </svg>


    <svg width="200" height="200">
    <defs>
    <filter id="sombra">
        <!-- 1. Difuminar la imagen original -->
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
        <!-- 2. Desplazar el difuminado -->
        <feOffset in="blur" dx="4" dy="4" result="desplazado" />
        
        <!-- 3. Combinar sombra + elemento original -->
        <feBlend in="SourceGraphic" in2="desplazado" mode="normal" />
    </filter>
    </defs>
        <rect x="40" y="40" width="100" height="100" fill="tomato" filter="url(#sombra)" />
    </svg>


    <svg viewBox="0 0 90 10" xmlns="http://www.w3.org/2000/svg" width="1000" height="200">
    <defs>
    <filter id="shadow"> <feDropShadow dx="0.2" dy="0.4" stdDeviation="0.2" /> </filter>
    <filter id="shadow2"> <feDropShadow dx="0" dy="0" stdDeviation="0.5" flood-color="green" /> </filter>
    <filter id="shadow3">
        <feDropShadow dx="-0.8" dy="-0.8" stdDeviation="0"
        flood-color="green" flood-opacity="0.5" />
    </filter>
    </defs>
        <circle cx="5" cy="50%" r="4" style="fill:green; filter:url(#shadow);" />
        <circle cx="15" cy="50%" r="4" style="fill:green; filter:url(#shadow2);" />
        <circle cx="25" cy="50%" r="4" style="fill:green; filter:url(#shadow3);" />
    </svg>
    <br>

    <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    <filter id="spotlight">
        <feSpecularLighting result="spotlight" specularConstant="1.5"
        specularExponent="80" lighting-color="white">

        <fePointLight x="50" y="50" z="220" />
        </feSpecularLighting>
        <feComposite
        in="SourceGraphic" in2="spotlight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
    </defs>
        <image href="LOKI.png" x="10%" y="10%" width="80%" height="80%"
        style="filter:url(#spotlight);" />
    </svg>

    <svg
        width="200" height="200" xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <filter id="filtroverde">
        <feFlood
        result="floodFill" x="0" y="0"
        width="100%" height="100%"
        flood-color="blue"
        flood-opacity="1" />
        <feBlend in="SourceGraphic" in2="floodFill" mode="multiply" />

        </filter>
    </defs>
        <image href="LOKI.png" x="10%" y="10%" width="80%" height="80%"
        style="filter:url(#filtroverde);" />
    </svg>

    <svg width="200" height="200" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <filter id="displacementFilter">
        <feTurbulence
        type="turbulence" baseFrequency="0.05"
        numOctaves="2" result="turbulence" />
        <feDisplacementMap
        in2="turbulence" in="SourceGraphic"
        scale="50" xChannelSelector="R"
        yChannelSelector="G" />
        </filter>
        <circle cx="100" cy="100" r="100" style="filter: url(#displacementFilter)" />
    </svg>
</body>
</html>
