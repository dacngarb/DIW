
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Cantero García</title>
</head>
<body>

    <h1>Galería de paisajes</h1>

    <h2>1. Paisaje de montaña</h2>
    <picture>
        <source srcset="./montana.avif" type="image/avif">
        <source srcset="./montana.webp" type="image/webp">
        <img src="./montana.jpg"
             alt="Paisaje de montañas y lago"
             width="800" height="600">
    </picture>

    <h2>2. Paisaje de playa</h2>
    <picture>
        <source srcset="./playa.avif" type="image/avif">
        <source srcset="./playa.webp" type="image/webp">
        <img src="./playa.jpg"
             alt="Paisaje de playa y mar"
             width="360" height="270">
    </picture>

    <h2>3. Paisaje de bosque</h2>
    <picture>
        <source srcset="./bosque.avif" type="image/avif">
        <source srcset="./bosque.webp" type="image/webp">
        <img src="./bosque.jpg"
             alt="Paisaje de bosque verde"
             width="800" height="400">
    </picture>

</body>
</html>
