    <h1>7. Meta Author</h1>
    <p>La etiqueta meta author permite indicar el nombre del autor de una página web.</p>
    <h2>Importancia</h2>
    <p>Sirve para identificar quién ha creado el documento. No mejora directamente el posicionamiento en buscadores.</p>
    <h2>Ejemplo</h2>
    <pre><code>&lt;meta name="author" content="David Cantero García"&gt;</code></pre>
