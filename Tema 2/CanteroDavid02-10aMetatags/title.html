<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Meta Title</title>
</head>
<body>
    <h1>1. Meta Title</h1>
    <p>La etiqueta title define el título de la página web. Aparece en la pestaña del navegador y puede aparecer en los resultados de Google.</p>
    <h2>Ejemplo</h2>
    <pre><code>&lt;title&gt;Mi página web&lt;/title&gt;</code></pre>

</body>
</html>
