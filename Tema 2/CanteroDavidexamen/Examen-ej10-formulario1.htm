<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Examen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            padding: 20px;
        }

        .container {
            border: 2px solid #0000ff;
            background-color: #e0f7fa;
            padding: 20px;
            max-width: 850px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-family: 'Impact', sans-serif;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        fieldset {
            border: 1px solid #7f7f7f;
            border-radius: 0px;
            padding: 12px;
            margin-bottom: 5px;
            background-color: transparent;
        }

        legend {
            font-weight: bold;
            color: #0000ff;
            font-size: 16px;
            padding: 0 5px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 95%;
            padding: 4px 6px;
            border: 1px solid #767676;
            border-radius: 2px;
            font-size: 14px;
        }

        textarea {
            height: 70px;
            resize: vertical;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Estilos de barras de progreso y meters */
        progress, meter {
            width: 100%;
            height: 12px;
        }

        .full-width {
            grid-column: span 2;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-submit {
            background-color: #000000;
            color: #ccff00;
            font-weight: bold;
            font-size: 18px;
            padding: 8px 30px;
            border-radius: 20px;
            border: 2px solid #7f7f7f;
            cursor: pointer;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
        .img1 { 


        }
    </style>
</head>
<body>

     <h1> Diseño de Interfaces Web </h1>
    <h1> Ejercicio 9 formulario </h1>
<br>
<div class="container">
       <img src="imgs/form.jpg" class="form-group"></div>
       
       <br>
       
       <br>
       
       <br>

<div class="container">
   

       <br>

    <form action="#" method="post" enctype="multipart/form-data">
         <h1> Formulario de Examen </h1>
        <div class="grid">
            
            <!-- Sección Usuario -->
            <fieldset>
                <legend style="color: #00A; ">Usuario</legend>
                <div class="form-group">
                    <label for="alias">Alias:</label>
                    <input type="text" id="alias" maxlength="30" placeholder="tamaño máximo alias 30 caracteres">
                    
                    
                </div>

                <div class="form-group">
                 <label for="alias">Apellidos:</label>
                    <input type="text" id="Apellidos" >
                </div>

                <div class="form-group">
                    <label for="alias">Nombre:</label>
                    <input type="text" id="Nombre">
                </div>
            </fieldset>

            <!-- Sección Datos de Contacto -->
            <fieldset> 
                <legend style="color: #00A; ">Datos de Contacto</legend>
                <div class="form-group">
                    <label for="Teléfono">Teléfono:</label>
                    <input type="tel" id="Teléfono">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label for="nacimiento">Fecha nacimiento:</label>
                    <input type="date" id="nacimiento">
                </div>
            </fieldset>

            <!-- Sección Solicitud Cita -->
            <fieldset>
           
                <legend style="color: #00A; ">Solicitud Cita</legend>

                <div class="form-group">
                    <label for="hora">Hora cita</label>
                    <input type="time" id="hora">
                </div>

                <div class="form-group">
                    <label for="formalidad">Formalidad Deseada del Asistente</label><br>
                     - <input type="range" id="formalidad" min="0" max="100"> +
                </div>

                <div class="form-group">
                    <label for="sede">Sedes Disponibles</label><br>
                        <select id="sede" onchange="actualizarComentario(this.value)" style="width: 100%;">
                            <option value="" disabled selected>Pulsa para ver concierto</option>
                            <option value="Málaga">Málaga</option>
                            <option value="Churriana">Churriana</option>
                            <option value="Torremolinos">Torremolinos</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Sección Información Adicional -->
            <fieldset>
                <legend style="color: #00A; ">Información Adicional</legend>
                <div class="form-group">
                    <label for="comentario">Que te parecio el concierto:</label><br>
                    <textarea id="comentario" placeholder="Escribe tus impresiones" style="width: 99%; height: 80px; resize: none;"></textarea><br><br>
                    <label for="valoracion">Valoración:</label><br>
                    <input type="number" id="valoracion" min="1" max="10" placeholder="Escoge el valor " style="width: 20%;">
                    
                </div>
            
            </fieldset>

            <!-- Sección Progresos -->
            <fieldset class="full-width">
                <legend style="color: #00A; ">Progresos</legend>
                <label for="progreso">Progresos del formulario</label><br>
                <progress id="progreso" value="90" max="100" style="width: 100%; margin-right: 10px;"></progress><br>
                <br><label for="meter">Meter de la encuesta</label><br>
                <meter meter id="meter" min="0" max="100" value="25" style="width: 100%;"></meter>

            </fieldset>

            <!-- NUEVA Sección: Subida de múltiples archivos -->
            <fieldset class="full-width">
                <legend style="color: #00A; ">Adjuntar Documentación</legend>                
                <div class="form-group">
                    <label for="archivo">Seleccionar uno o más archivos:</label><br>
                    <input type="file" id="archivo" multiple>
                </div>
            </fieldset>

             <!-- Botón Enviar -->
            <div class="actions" >
                <button type="submit" style="color: yellow; background-color: #000000; height: 40px; width: 80px; border-radius: 20px;">Enviar</button>
            </div>

        </div>

       
    </form>
</div>

</body>
</html>
