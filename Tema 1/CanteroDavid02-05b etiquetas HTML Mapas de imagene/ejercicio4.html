<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Cantero García</title>
</head>

<body>
    <h1>Ejercicio 4</h1>

    <img src="ejercicio4.png" id="map-image" style="width: 368px; max-width: 100%; height: auto;" alt="" usemap="#map">

    <map name="map">

    <script>
        $(document).ready(function () {
            $("map").imageMapResize();
        });
    </script>
